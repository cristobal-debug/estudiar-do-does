const GUIDE=`<div class="card"><h2>Present Simple: estructura</h2><div class="tw"><table><tr><th>Tipo</th><th>Estructura</th></tr>

<tr><td>Negativa</td><td>Sujeto + do / does + not + verbo base</td></tr>
<tr><td>Pregunta</td><td>Do / Does + sujeto + verbo base</td></tr>

<tr><td>Casi todos: +s</td><td>work → works, kill → kills</td></tr>
<tr><td>Acaba en -s, -sh, -ch, -x, -z, -o: +es</td><td>kiss → kisses, pass → passes, finish → finishes, watch → watches, fix → fixes, go → goes, do → does</td></tr>

<tr><td>Vocal + y: +s</td><td>play → plays, enjoy → enjoys, stay → stays</td></tr>

<tr><td>he, she, it</td><td>is (he's)</td><td>isn't, 's not</td><td>Is he?</td></tr>
<tr><td>you, we, they</td><td>are (you're)</td><td>aren't, 're not</td><td>Are you?</td></tr></table></div>
<p>Wh-: palabra + to be + sujeto. Where are we? How is she?</p>
<h2>Verbo can</h2><p>Sirve para habilidad, capacidad, permiso y favores. Sujeto + can + verbo base, sin -s con he, she, it. Negativa: can't o cannot. Pregunta: Can + sujeto + verbo. Wh-: When can I go?</p>

<tr><td>Siglas</td><td>TV, CD, DVD, NASA, NBA, ASAP, OK, LOL</td></tr></table></div>
<p>Pon un punto al final de cada frase, salvo que termine en signo de interrogación o de exclamación.</p>

const BEN=/\b(am|is|are|isn't|aren't)\b/i,CAN=/\bcan(not|'t)?\b/i,WHR=/^(what|where|when|why|who|how|which|whose)\b/i;
function chk(k,x){x=x.trim().replace(/’/g,"'");if(!x)return['',''];
  if(!/^[A-Z]/.test(x))return['no','Empieza con mayúscula.'];
  if(k!=='bq'&&BEN.test(x))return['no','No uses be.'];
  if(k[0]!=='c'&&CAN.test(x))return['no','No uses can.'];
  const wh=WHR.test(x);
  if(k==='aff'){if(/\b(don't|doesn't|not)\b/i.test(x))return['no','Es afirmativa: sin not.'];return /\.$/.test(x)?['ok','']:['no','Falta el punto final.']}
  if(k==='neg'){if(!/\b(don't|doesn't|do not|does not)\b/i.test(x))return['no','Falta don\'t / doesn\'t (o do not / does not).'];return /\.$/.test(x)?['ok','']:['no','Falta el punto final.']}
  if(k==='cn'){if(/\b(don't|doesn't)\b/i.test(x))return['no','Con can no se usa don\'t / doesn\'t.'];if(!/\b(can't|cannot|can not)\b/i.test(x))return['no','Falta can\'t o cannot.'];return /\.$/.test(x)?['ok','']:['no','Falta el punto final.']}
  if(k==='ca'){if(/\b(can't|cannot|not)\b/i.test(x))return['no','Es afirmativa: sin not.'];if(!/\bcan\b/i.test(x))return['no','Falta can.'];return /\.$/.test(x)?['ok','']:['no','Falta el punto final.']}
  if(!/\?$/.test(x))return['no','Falta el signo ?.'];
  if(k==='q')return /^(do|does)\b/i.test(x)||wh&&/\b(do|does)\b/i.test(x)?['ok',wh?'Wh-':'Yes/No']:['no','Empieza con Do / Does, o con una palabra Wh- y luego do / does.'];
  if(k==='bq')return /^(am|is|are)\b/i.test(x)||wh&&/\b(am|is|are)\b/i.test(x)?['ok',wh?'Wh-':'Yes/No']:['no','Empieza con Am / Is / Are, o con una palabra Wh- y luego am / is / are.'];
  return /^can\b/i.test(x)||wh&&/\bcan\b/i.test(x)?['ok',wh?'Wh-':'Yes/No']:['no','Empieza con Can, o con una palabra Wh- y luego can.']}
function tareas(){let sv={};try{sv=JSON.parse(localStorage.getItem('tareas')||'{}')}catch(_){}
  const a=$('#app');a.onclick=null;a.onkeydown=null;
  a.innerHTML=TK.map((T,j)=>`<div class="card" style="margin-bottom:16px"><h2>${T.t}</h2><p>${T.n}</p><div class="pista"><b>Pista: estructura</b>${T.h.map(h=>`<div>${h}</div>`).join('')}<div>Ejemplo de clase: ${T.ex}</div></div>${[...Array(10)].map((_,i)=>`<div class="ln"><input data-j="${j}" data-i="${i}" autocomplete="off" aria-label="Frase ${i+1}" placeholder="${i+1}." value="${(sv[j+'-'+i]||'').replace(/"/g,'&quot;')}"><small></small></div>`).join('')}<p class="sum" aria-live="polite"></p></div>`).join('');
  const upd=j=>{const T=TK[j];let g=0,w=0;const L=[...document.querySelectorAll(`input[data-j="${j}"]`)];
    L.forEach(x=>{const [st,m]=chk(T.k,x.value),sm=x.nextElementSibling;sm.className=st;sm.textContent=st==='ok'?'Correcto'+(m?' ('+m+')':''):m;if(st==='ok'){g++;if(m==='Wh-')w++}});
    L[0].closest('.card').querySelector('.sum').textContent=`Frases correctas: ${g} de 10.`+(T.w?` Preguntas Wh-: ${w} de ${T.w}.`:'')+' Comprueba tú que cada sujeto y cada verbo sean distintos.'};
  a.oninput=e=>{const t=e.target;if(t.dataset.j===undefined)return;upd(+t.dataset.j);try{sv[t.dataset.j+'-'+t.dataset.i]=t.value;localStorage.setItem('tareas',JSON.stringify(sv))}catch(_){}};
  TK.forEach((_,j)=>upd(j))}
function typed(){const [v,a,e]=Q[i];let res=null;
  const go=()=>{const x=$('#ans').value.trim().toLowerCase();if(!x)return;res=x===a?'ok':'no';res==='ok'?ok++:miss.push(Q[i]);paint()};
  const paint=()=>{shell(`<span class="badge">Tercera persona</span><p class="q">He / she / it: <b>${v}</b></p>${res?fb(res==='ok',(res==='ok'?'Correcto. ':'Era "'+a+'". ')+e):`<div class="row"><input id="ans" autocomplete="off" autocapitalize="none" aria-label="Tu respuesta"><button class="btn" id="chk">Comprobar</button></div>`}`);
    const n=$('#ans')||$('#nx');n.focus();
    $('#app').onclick=ev=>{if(next(ev))return;if(!res&&ev.target.closest('#chk'))go()};
    $('#app').onkeydown=ev=>{if(ev.key==='Enter'&&!res&&ev.target.id==='ans')go()}};
  paint()}
function shell(inner){$('#app').innerHTML=`<div class="card"><div class="meta"><span>${i+1} de ${Q.length}</span><span>Aciertos: ${ok}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div>${inner}</div>`}
const fb=(good,t)=>`<div class="fb ${good?'':'no'}" role="status">${t}</div><div class="row" style="margin-top:12px"><button class="btn" id="nx">Siguiente</button></div>`;
function next(e){if(e.target.closest('#nx')){i++;draw();return true}}
function draw(){
  if(i>=Q.length){
    $('#app').innerHTML=`<div class="card"><p class="q">${ok} de ${Q.length} aciertos</p><p class="sub">${miss.length?'Repite los fallos para fijarlos.':'Sin fallos. Prueba otro ejercicio o repítelo.'}</p><div class="row">${miss.length?`<button class="btn" id="rp">Repetir los fallos (${miss.length})</button>`:''}<button class="btn ghost" id="ag">Empezar de nuevo</button></div></div>`;
    $('#app').onclick=e=>{if(e.target.closest('#rp'))start(mode,miss);if(e.target.closest('#ag'))start(mode)};
    return;
  }
  mode==='build'||mode==='clase'?build():mode==='third'?typed():fill();
}
function build(){
  const [es,t,a,d]=Q[i];const w=sh(a.split(' ').concat(d));let sel=[],res=null;
  const paint=()=>{
    shell(`<span class="badge">${LAB[t]}</span><p class="q">${es}</p>
    <div class="slot" aria-label="Tu frase">${sel.map(k=>`<button class="tile" data-s="${k}" ${res?'disabled':''}>${w[k]}</button>`).join('')}</div>
    <div class="pool">${w.map((x,k)=>`<button class="tile" data-p="${k}" ${sel.includes(k)||res?'disabled':''}>${x}</button>`).join('')}</div>
    ${res?fb(res==='ok',res==='ok'?'Correcto. '+TIPS[t]:'Era: '+a+'. '+TIPS[t]):`<div class="row"><button class="btn" id="chk" ${sel.length?'':'disabled'}>Comprobar</button><button class="btn ghost" id="clr">Borrar</button></div>`}`);
    $('#app').onclick=e=>{
      if(next(e))return;
      const p=e.target.closest('[data-p]'),s=e.target.closest('[data-s]');
      if(res)return;
      if(p&&!p.disabled){sel.push(+p.dataset.p);paint()}
      else if(s){sel=sel.filter(k=>k!==+s.dataset.s);paint()}
      else if(e.target.closest('#clr')){sel=[];paint()}
      else if(e.target.closest('#chk')){
        const good=sel.map(k=>w[k]).join(' ').toLowerCase()===a.toLowerCase();
        res=good?'ok':'no';good?ok++:miss.push(Q[i]);paint();
      }
    };
  };
  paint();
}
function fill(){
  const [s,o,c,e]=Q[i];let pick=null;
  const paint=()=>{
    shell(`<p class="q">${s.replace('___','<b>_____</b>')}</p>
    <div class="opts">${o.map((x,k)=>`<button class="opt ${pick===null?'':k===c?'ok':k===pick?'no':''}" data-o="${k}" ${pick===null?'':'disabled'}>${x}</button>`).join('')}</div>
    ${pick===null?'':fb(pick===c,(pick===c?'Correcto. ':'Era "'+o[c]+'". ')+e)}`);
    $('#app').onclick=ev=>{
      if(next(ev))return;
      const b=ev.target.closest('[data-o]');
      if(b&&pick===null){pick=+b.dataset.o;pick===c?ok++:miss.push(Q[i]);paint()}
    };
  };
  paint();
}
start('guide');
</script></body></html>
